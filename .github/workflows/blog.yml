name: blog-auto-post

on:
  schedule:
    # 한국시간 오전 8:13, 오후 1:13, 저녁 7:13 (하루 3편)
    - cron: "13 23 * * *"
    - cron: "13 4 * * *"
    - cron: "13 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 글 쓰고 발행하기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python blog_bot.py

      - name: 발행 기록 저장
        if: always()
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "발행 기록 업데이트"
          git push
