name: yt-playlist
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env:
          YT_CLIENT_ID: "247650144997-6bqc20isrbqi12fcsani6joed6jrvff5.apps.googleusercontent.com"
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u tools/yt_playlist.py
      - run: |
          git config user.name "playlist-bot"; git config user.email "playlist-bot@users.noreply.github.com"
          git add data/playlist_senior.txt; git diff --cached --quiet && exit 0
          git commit -m "이어 듣기 재생목록 ID"; for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
