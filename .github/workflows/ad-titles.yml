name: ad-titles
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 이면 목록만"
        default: "1"
      mode:
        description: "add=제목에 [광고] 붙이기, remove=[광고] 떼고 유료 광고 표시 켜기"
        default: "add"
jobs:
  fix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ch: senior
            secret: YOUTUBE_REFRESH_TOKEN
            cid: "247650144997-6bqc20isrbqi12fcsani6joed6jrvff5.apps.googleusercontent.com"
            csec: YT_CLIENT_SECRET
          - ch: econ
            secret: YT_ECON_REFRESH_TOKEN
            cid: "480498053335-1t1f61lpgpcne9e895hfs98r7qvickpj.apps.googleusercontent.com"
            csec: YT_ECON_CLIENT_SECRET
          - ch: kids
            secret: YT_KIDS_REFRESH_TOKEN
            cid: "106566243572-9l2f41lloc7c9nei86hu8rema4n6k0kd.apps.googleusercontent.com"
            csec: YT_KIDS_CLIENT_SECRET
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 제목에 [광고] 붙이기
        env:
          CH_NAME: ${{ matrix.ch }}
          DRY_RUN: ${{ github.event.inputs.dry }}
          MODE: ${{ github.event.inputs.mode }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ matrix.cid }}
          YT_CLIENT_SECRET: ${{ secrets[matrix.csec] }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets[matrix.secret] }}
        run: python -u tools/yt_ad_titles.py
