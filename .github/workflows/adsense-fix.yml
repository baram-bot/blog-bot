name: adsense-fix
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list 또는 revert"
        default: "list"
      blog:
        description: "econ / nohu / kids"
        default: "econ"
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ECON_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          WHICH: ${{ github.event.inputs.blog }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$WHICH" in nohu) export BLOGGER_BLOG_ID=8885340922893837263;; kids) export BLOGGER_BLOG_ID=1089607515072453210;; *) export BLOGGER_BLOG_ID="$ECON_ID";; esac
          python -u tools/adsense_fix.py
