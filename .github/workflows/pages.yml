name: blog-pages
on:
  push:
    branches: [main]
    paths: ["pages_nohu/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: blog-auto-post
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PAGES_BLOG_ID: "8885340922893837263"
        run: python -u pages_bot.py
      - run: |
          git config user.name "blog-bot"; git config user.email "blog-bot@users.noreply.github.com"
          git add data/pages_nohu.json; git diff --cached --quiet && exit 0
          git commit -qm "노후 블로그 페이지 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
