name: tc-voices
on: workflow_dispatch
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for g in male female; do for a in elder middle_age child teenager; do
            echo "== $g $a"
            curl -s -H "X-API-KEY: $K" "https://api.typecast.ai/v3/voices?model=ssfm-v31&gender=$g&age=$a"
            echo
          done; done
        env:
          K: ${{ secrets.TYPECAST_API_KEY }}
