name: check-secrets
on:
  push:
    branches: [main]
    paths: [".github/workflows/check-secrets.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
          G: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          echo "telegram_token_set=$([ -n "$T" ] && echo yes || echo no) chat_set=$([ -n "$C" ] && echo yes || echo no) google_set=$([ -n "$G" ] && echo yes || echo no)" > data/secrets_check.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/secrets_check.txt; git commit -m "secrets check" -q; git push -q
