name: blog-update-posts

on:
  push:
    branches: [main]
    paths: ["data/update_queue.txt"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-auto-post
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 발행된 글 다시 고쳐 올리기
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python -u update_posts.py
      - name: 큐 정리
        if: always()
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add data/update_queue.txt
          git diff --cached --quiet && exit 0
          git commit -m "수정 큐 정리 [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
