name: blog-nohu-post

on:
  push:
    branches: [main]
    paths: ["posts_nohu/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 든든한 노후 소식 블로그 발행
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: "8885340922893837263"
          BLOG_POSTS_DIR: posts_nohu
          BLOG_STATE: posted_nohu.json
        run: python -u blog_bot.py
      - name: 발행 기록 저장
        if: always()
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add data/posted_nohu.json
          git diff --cached --quiet || (git commit -m "노후 블로그 발행 기록" && for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done)
