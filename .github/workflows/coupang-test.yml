name: coupang-test
on:
  workflow_dispatch:
    inputs:
      q:
        description: "검색어"
        default: "미니 금고"
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          Q: ${{ github.event.inputs.q }}
        run: |
          python -u tools/coupang_report.py
